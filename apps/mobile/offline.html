<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>기억해유</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 0 28px; background: #fff; color: #1d2125; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
      h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: 0.02em; }
      p { margin: 0; font-size: 16px; line-height: 1.6; color: #6e737a; }
      button { height: 52px; border: 0; border-radius: 14px; background: #1d2125; color: #fff; font-size: 15.5px; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>기억해유</h1>
    <p>인터넷에 연결되지 않았어요. 연결을 확인하고 다시 시도해 주세요.<br />You're offline. Check your connection and try again.</p>
    <button type="button" id="retry">다시 시도 / Try again</button>
    <script>
      document.getElementById("retry").onclick = function () { location.href = __SERVER_URL__; };
    </script>
  </body>
</html>
